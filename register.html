<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - AGAdmin</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link href="assets/css/style.css" rel="stylesheet">
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .register-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            max-width: 900px;
            width: 100%;
        }
        
        .register-left {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        .register-right {
            padding: 60px 40px;
        }
        
        .register-logo {
            font-size: 3rem;
            margin-bottom: 20px;
        }
        
        .register-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 15px;
        }
        
        .register-subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-bottom: 30px;
        }
        
        .feature-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .feature-list li {
            padding: 10px 0;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .feature-list i {
            font-size: 1.2rem;
            opacity: 0.8;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        
        .form-control {
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 12px 15px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        
        .btn-register {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            width: 100%;
            transition: all 0.3s ease;
        }
        
        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .login-link {
            text-align: center;
            margin-top: 30px;
            color: #666;
        }
        
        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        
        .login-link a:hover {
            text-decoration: underline;
        }
        
        .password-strength {
            margin-top: 5px;
            font-size: 0.9rem;
        }
        
        .strength-weak {
            color: #dc3545;
        }
        
        .strength-medium {
            color: #ffc107;
        }
        
        .strength-strong {
            color: #28a745;
        }
        
        .terms-checkbox {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 25px;
        }
        
        .terms-checkbox input[type="checkbox"] {
            margin-top: 5px;
        }
        
        .terms-text {
            font-size: 0.9rem;
            color: #666;
            line-height: 1.5;
        }
        
        .terms-text a {
            color: #667eea;
            text-decoration: none;
        }
        
        .terms-text a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            .register-container {
                margin: 20px;
                border-radius: 15px;
            }
            
            .register-left {
                padding: 40px 30px;
            }
            
            .register-right {
                padding: 40px 30px;
            }
            
            .register-title {
                font-size: 1.5rem;
            }
            
            .register-subtitle {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="row g-0">
            <!-- Left Side - Branding -->
            <div class="col-md-5">
                <div class="register-left">
                    <div class="register-logo">
                        <i class="fas fa-tachometer-alt"></i>
                    </div>
                    <h2 class="register-title">AGAdmin</h2>
                    <p class="register-subtitle">Complete Business Admin Panel</p>
                    
                    <ul class="feature-list">
                        <li>
                            <i class="fas fa-check-circle"></i>
                            <span>Comprehensive Dashboard</span>
                        </li>
                        <li>
                            <i class="fas fa-check-circle"></i>
                            <span>User Management System</span>
                        </li>
                        <li>
                            <i class="fas fa-check-circle"></i>
                            <span>Business Modules</span>
                        </li>
                        <li>
                            <i class="fas fa-check-circle"></i>
                            <span>Analytics & Reports</span>
                        </li>
                        <li>
                            <i class="fas fa-check-circle"></i>
                            <span>Communication Tools</span>
                        </li>
                    </ul>
                </div>
            </div>
            
            <!-- Right Side - Registration Form -->
            <div class="col-md-7">
                <div class="register-right">
                    <h3 class="text-center mb-4">Create Your Account</h3>
                    
                    <form id="registerForm">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="firstName" class="form-label">First Name *</label>
                                    <input type="text" class="form-control" id="firstName" name="firstName" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="lastName" class="form-label">Last Name *</label>
                                    <input type="text" class="form-control" id="lastName" name="lastName" required>
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="email" class="form-label">Email Address *</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="phone" class="form-label">Phone Number</label>
                            <input type="tel" class="form-control" id="phone" name="phone">
                        </div>
                        
                        <div class="form-group">
                            <label for="company" class="form-label">Company Name</label>
                            <input type="text" class="form-control" id="company" name="company">
                        </div>
                        
                        <div class="form-group">
                            <label for="password" class="form-label">Password *</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                            <div class="password-strength" id="passwordStrength"></div>
                        </div>
                        
                        <div class="form-group">
                            <label for="confirmPassword" class="form-label">Confirm Password *</label>
                            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
                        </div>
                        
                        <div class="terms-checkbox">
                            <input type="checkbox" id="agreeTerms" name="agreeTerms" required>
                            <label for="agreeTerms" class="terms-text">
                                I agree to the <a href="#" onclick="showTerms()">Terms of Service</a> and <a href="#" onclick="showPrivacy()">Privacy Policy</a>
                            </label>
                        </div>
                        
                        <button type="submit" class="btn btn-register">
                            <i class="fas fa-user-plus me-2"></i>Create Account
                        </button>
                    </form>
                    
                    <div class="login-link">
                        Already have an account? <a href="login.html">Sign in here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Toastr -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    
    <script>
        $(document).ready(function() {
            // Password strength checker
            $('#password').on('input', function() {
                const password = $(this).val();
                const strength = checkPasswordStrength(password);
                const strengthDiv = $('#passwordStrength');
                
                if (password.length === 0) {
                    strengthDiv.html('');
                    return;
                }
                
                let strengthText = '';
                let strengthClass = '';
                
                if (strength < 3) {
                    strengthText = 'Weak password';
                    strengthClass = 'strength-weak';
                } else if (strength < 5) {
                    strengthText = 'Medium password';
                    strengthClass = 'strength-medium';
                } else {
                    strengthText = 'Strong password';
                    strengthClass = 'strength-strong';
                }
                
                strengthDiv.html(`<span class="${strengthClass}">${strengthText}</span>`);
            });
            
            // Confirm password validation
            $('#confirmPassword').on('input', function() {
                const password = $('#password').val();
                const confirmPassword = $(this).val();
                
                if (confirmPassword.length > 0) {
                    if (password === confirmPassword) {
                        $(this).removeClass('is-invalid').addClass('is-valid');
                    } else {
                        $(this).removeClass('is-valid').addClass('is-invalid');
                    }
                } else {
                    $(this).removeClass('is-valid is-invalid');
                }
            });
            
            // Form submission
            $('#registerForm').on('submit', function(e) {
                e.preventDefault();
                
                const password = $('#password').val();
                const confirmPassword = $('#confirmPassword').val();
                
                if (password !== confirmPassword) {
                    toastr.error('Passwords do not match');
                    return;
                }
                
                if (!checkPasswordStrength(password)) {
                    toastr.error('Password is too weak');
                    return;
                }
                
                // Simulate registration process
                Swal.fire({
                    title: 'Creating Account...',
                    text: 'Please wait while we create your account',
                    allowOutsideClick: false,
                    showConfirmButton: false,
                    didOpen: () => {
                        Swal.showLoading();
                    }
                });
                
                setTimeout(() => {
                    Swal.fire({
                        title: 'Success!',
                        text: 'Your account has been created successfully',
                        icon: 'success',
                        confirmButtonText: 'Continue to Login'
                    }).then(() => {
                        window.location.href = 'login.html';
                    });
                }, 2000);
            });
        });
        
        function checkPasswordStrength(password) {
            let strength = 0;
            
            if (password.length >= 8) strength++;
            if (password.match(/[a-z]/)) strength++;
            if (password.match(/[A-Z]/)) strength++;
            if (password.match(/[0-9]/)) strength++;
            if (password.match(/[^a-zA-Z0-9]/)) strength++;
            
            return strength;
        }
        
        function showTerms() {
            Swal.fire({
                title: 'Terms of Service',
                html: `
                    <div style="text-align: left; max-height: 400px; overflow-y: auto;">
                        <h5>1. Acceptance of Terms</h5>
                        <p>By accessing and using AGAdmin, you accept and agree to be bound by the terms and provision of this agreement.</p>
                        
                        <h5>2. Use License</h5>
                        <p>Permission is granted to temporarily download one copy of AGAdmin per device for personal, non-commercial transitory viewing only.</p>
                        
                        <h5>3. Disclaimer</h5>
                        <p>The materials on AGAdmin are provided on an 'as is' basis. AGAdmin makes no warranties, expressed or implied, and hereby disclaims and negates all other warranties.</p>
                        
                        <h5>4. Limitations</h5>
                        <p>In no event shall AGAdmin or its suppliers be liable for any damages arising out of the use or inability to use the materials on AGAdmin.</p>
                        
                        <h5>5. Accuracy of Materials</h5>
                        <p>The materials appearing on AGAdmin could include technical, typographical, or photographic errors.</p>
                    </div>
                `,
                width: '600px',
                confirmButtonText: 'I Understand'
            });
        }
        
        function showPrivacy() {
            Swal.fire({
                title: 'Privacy Policy',
                html: `
                    <div style="text-align: left; max-height: 400px; overflow-y: auto;">
                        <h5>1. Information We Collect</h5>
                        <p>We collect information you provide directly to us, such as when you create an account, use our services, or contact us.</p>
                        
                        <h5>2. How We Use Your Information</h5>
                        <p>We use the information we collect to provide, maintain, and improve our services, process transactions, and communicate with you.</p>
                        
                        <h5>3. Information Sharing</h5>
                        <p>We do not sell, trade, or otherwise transfer your personal information to third parties without your consent.</p>
                        
                        <h5>4. Data Security</h5>
                        <p>We implement appropriate security measures to protect your personal information against unauthorized access, alteration, disclosure, or destruction.</p>
                        
                        <h5>5. Your Rights</h5>
                        <p>You have the right to access, update, or delete your personal information. You may also opt out of certain communications from us.</p>
                    </div>
                `,
                width: '600px',
                confirmButtonText: 'I Understand'
            });
        }
    </script>
</body>
</html>
